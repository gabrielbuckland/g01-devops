# Local counterpart of g01-monitoring/prometheus/prometheus.yml.
#
# That file scrapes the two lab VMs by hostname. Here everything runs in one
# compose network, so the targets are service names instead. The scrape
# interval and the blackbox relabeling are kept identical.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # The job is called test-postgres because the dashboard in
  # g01-monitoring/grafana queries pg_stat_activity_count{job="test-postgres"}.
  # Keeping the name lets that dashboard be used unmodified.
  - job_name: 'test-postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'frontend-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://traefik/
        labels:
          env: local
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'backend-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://traefik/api
        labels:
          env: local
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
