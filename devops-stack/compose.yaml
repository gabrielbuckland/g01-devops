# Single entry point for the whole system on one machine.
#
# In the original setup this ran on three separate VMs: the application on
# srv-020 (test) and srv-021 (prod), the monitoring on srv-003. Those VMs are
# part of the HSLU lab network and are no longer reachable. This file collapses
# the three onto one host so the system can still be seen end to end.
#
# The three repositories stay untouched. The Grafana dashboard and the database
# schema are mounted read only from where they already live, so there is no
# second copy that can drift. Everything that is specific to running locally
# lives in this directory.
#
# Two things the application assumes but cannot get locally:
#   - a Unleash server, normally the GitLab feature flags API, replaced here by
#     the flags service below
#   - a reachable image registry, replaced by building from source

name: g01

x-app: &app
  build:
    context: ..
    dockerfile: devops-stack/Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp

services:

  # Single published port for the entire stack. Everything else is reached
  # through path prefixes, exactly as Traefik routed it on the lab VMs.
  # Published on 8081 rather than 80 so the stack does not collide with
  # anything already listening on the default HTTP port.
  traefik:
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${WEB_PORT:-8081}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published on the host. The exporter and the backend reach it over the
    # compose network, and port 5432 is frequently taken on a developer machine.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *app
    build:
      context: ..
      dockerfile: devops-stack/Dockerfile
      target: backend
    environment:
      # Environment variables win over the profile properties, which is what
      # the deploy jobs in .gitlab-ci.yml relied on as well.
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://postgres:5432/postgres
      DATASOURCES_DEFAULT_USERNAME: postgres
      DATASOURCES_DEFAULT_PASSWORD: postgres
      MICRONAUT_ENVIRONMENTS: prod
      UNLEASH_URL: http://flags
      UNLEASH_INSTANCE_ID: local
      JAVA_OPTS: -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75
    depends_on:
      postgres:
        condition: service_healthy
    # Flyway applies V1__create_form_table.sql on startup, so the schema is
    # created by the application itself and needs no seed here.
    # 127.0.0.1 rather than localhost: both servers bind IPv4 only, and inside
    # these images localhost resolves to ::1 first, which is refused.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  frontend:
    <<: *app
    build:
      context: ..
      dockerfile: devops-stack/Dockerfile
      target: frontend
    # The original deployment has no frontend healthcheck. This one is added
    # here so that docker compose up --wait can tell when the stack is ready.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front.entrypoints=web"
      - "traefik.http.routers.front.rule=PathPrefix(`/`)"
      - "traefik.http.routers.front.priority=1"
      - "traefik.http.services.front.loadbalancer.server.port=3000"

  # Stands in for the GitLab feature flags API. FormController delays every
  # POST by ten seconds unless the flag fixloading is on, and an unreachable
  # Unleash server means the flag reads as off. Serving the flag locally keeps
  # the feature toggle demonstrable instead of looking like a broken form.
  # Set enabled to false in flags/www/client/features.json and wait a second to
  # see the delay it hides. The whole www directory is mounted rather than the
  # single JSON file, because editors replace a file instead of writing into
  # it, and a single file bind mount keeps pointing at the replaced inode.
  flags:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    volumes:
      - ./flags/www:/usr/share/nginx/html:ro
      - ./flags/default.conf:/etc/nginx/conf.d/default.conf:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pg-exporter.entrypoints=web"
      - "traefik.http.routers.pg-exporter.rule=PathPrefix(`/pg-exporter`)"
      - "traefik.http.routers.pg-exporter.middlewares=pg-strip"
      - "traefik.http.middlewares.pg-strip.stripprefix.prefixes=/pg-exporter"
      - "traefik.http.services.pg-exporter.loadbalancer.server.port=9187"

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # Traefik strips the prefix before forwarding, so Prometheus serves at
      # the root but has to be told the address the browser sees, otherwise its
      # own redirects drop the /prometheus prefix and land on the frontend.
      - "--web.external-url=http://localhost:${WEB_PORT:-8081}/prometheus"
      - "--web.route-prefix=/"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.middlewares=prometheus-strip"
      - "traefik.http.middlewares.prometheus-strip.stripprefix.prefixes=/prometheus"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blackbox.entrypoints=web"
      - "traefik.http.routers.blackbox.rule=PathPrefix(`/blackbox`)"
      - "traefik.http.routers.blackbox.middlewares=blackbox-strip"
      - "traefik.http.middlewares.blackbox-strip.stripprefix.prefixes=/blackbox"
      - "traefik.http.services.blackbox.loadbalancer.server.port=9115"

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: http://localhost:${WEB_PORT:-8081}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Local demo only. The dashboard is the point of this stack, and asking
      # for a login before showing it adds nothing here.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Mounted read only from the monitoring repository rather than copied, so
      # the dashboard shown here is the one that repository actually contains.
      - ../g01-monitoring/grafana:/var/lib/grafana/dashboards:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.priority=10"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
