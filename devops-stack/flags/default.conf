# Minimal stand-in for the Unleash API that the backend polls.
#
# unleash-client-java asks for /client/features and parses the body as JSON. It
# also posts registration and metrics, which a static server would answer with
# 405 and which the client would log as errors, so those two paths are answered
# with an empty 202 to keep the log clean.

server {
    listen 80;
    default_type application/json;

    location = /client/features {
        root /usr/share/nginx/html;
        try_files /client/features.json =404;
    }

    location = /client/register {
        return 202 '{}';
    }

    location = /client/metrics {
        return 202 '{}';
    }
}
