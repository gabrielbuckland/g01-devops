# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - test
  - build
  - deploy

sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml
  - local: gitlab/utils.yml

docker:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  rules:
    # run for branches and tags
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    # decide tags: commit sha always; add 'latest' on default branch; add tag name on releases
    - |
      cd backend
      TAGS="$CI_COMMIT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$TAGS,latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS,$CI_COMMIT_TAG"
      fi

      echo "Pushing to: $CI_REGISTRY_IMAGE-backend with tags: $TAGS"

      # Build & push. Pass auth via system properties.
      mvn compile -B -DskipTests \
        jib:build \
        -Djib.to.image="$CI_REGISTRY_IMAGE-backend" \
        -Djib.to.tags="$TAGS" \
        -Djib.to.auth.username="$CI_REGISTRY_USER" \
        -Djib.to.auth.password="$CI_REGISTRY_PASSWORD"


deploy-to-test:
  stage: deploy
  tags: ['deploy-test-docker']
  rules:
    - !reference [ .test_deployment_rules, rules ]
  image: docker:28.4.0-cli
  script:
    - docker version
    - docker compose version
    - docker compose -f docker_local.yml up -d
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker logout