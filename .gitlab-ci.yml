# Verhindert, dass Pipelines für Tags gestartet werden
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

stages:
  - deploy

deploy-monitoring-test:
  stage: deploy
  image: docker:28.4.0-cli # Selbes Image wie in deiner anderen Pipeline

  # WICHTIG:
  # Du musst einen GitLab Runner auf deinem Monitoring-Server
  # installieren und ihm DIESEN Tag geben.
  # Es darf NICHT 'deploy-test-docker' sein, da dieser
  # auf deinem App-Server (srv-020) läuft.
  tags: ['deploy-monitoring-docker']

  rules:
    # Löst das Deployment bei jedem Push auf den 'main'-Branch aus
    - if: $CI_COMMIT_BRANCH == "main"

  environment:
    name: monitoring/test
    # Ersetze dies mit der URL deines Monitoring-Servers
    url: http://srv-003.devops.ls.eee.intern:3000

  script:
    - echo "Deploying Monitoring Stack (Test)..."

    # Verwendet das 'docker_test_monitoring.yml' File, das
    # wir in der letzten Nachricht definiert haben.
    - docker compose -f docker_test.yml down --remove-orphans --timeout 60 || true
    - docker compose -f docker_test.yml pull
    - docker compose -f docker_test.yml up -d --wait --wait-timeout 180

    - echo "Monitoring Stack (Test) deployed!"
    - echo "Grafana UI: ${CI_ENVIRONMENT_URL}"
    - echo "Prometheus UI: http://srv-003.devops.ls.eee.intern:9090"

