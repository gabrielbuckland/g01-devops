version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: g01-form-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        - PUBLIC_BACKEND_API_URL=http://localhost:8080
    container_name: g01-form-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data: