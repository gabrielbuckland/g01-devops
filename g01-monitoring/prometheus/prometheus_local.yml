global:
  scrape_interval: 15s

scrape_configs:
  # This job scrapes the Prometheus server itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Data from prometheus-exporter on local machine in g01-form project
  - job_name: 'local-postgres'
    static_configs:
      - targets: ['host.docker.internal:9187']
